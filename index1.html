<!-- GANTI JAVASCRIPT DI AKHIR BODY -->
<script>
// ============================================
// KONFIGURASI SUPABASE - GANTI DENGAN CREDENTIALS ANDA!
// ============================================
const SUPABASE_URL = 'sb_publishable_9sIAK8Ev_hpsv2d_nQlH8w_7e9o9cSW';
const SUPABASE_ANON_KEY = 'sb_secret_lc40Ub8wUwTs5c9A3-rM8Q_yfRumjEf';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================
// LOAD DATA DARI DATABASE
// ============================================
async function loadPackages() {
    const { data } = await supabase
        .from('packages')
        .select('*')
        .eq('is_active', true)
        .order('price');
    
    if (!data) return;
    
    const container = document.getElementById('packages-container');
    if (!container) return;
    
    container.innerHTML = data.map((pkg, i) => `
        <div class="${pkg.is_popular ? 'bg-charcoal text-warm-white transform md:-translate-y-4 shadow-2xl relative' : 'bg-white border border-stone-200'} p-6 md:p-10 rounded-sm flex flex-col">
            ${pkg.is_popular ? '<div class="absolute top-0 right-0 bg-warm-white text-charcoal text-xs tracking-widest uppercase px-4 py-1 rounded-bl-sm font-semibold">Populer</div>' : ''}
            <h3 class="text-xl font-serif mb-2">${pkg.name}</h3>
            <p class="${pkg.is_popular ? 'text-stone-300' : 'text-soft-charcoal'} text-sm mb-6 font-light">${pkg.description || ''}</p>
            <div class="mb-8"><span class="text-4xl font-serif">Rp ${(pkg.price/1000000).toFixed(0)} Jt</span></div>
            <ul class="space-y-4 mb-10 flex-grow ${pkg.is_popular ? 'text-stone-200' : 'text-soft-charcoal'} text-sm">
                ${pkg.features.map(f => `<li class="flex items-start"><svg class="w-4 h-4 mr-3 mt-1 ${pkg.is_popular ? 'text-warm-white' : 'text-charcoal'} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>${f}</span></li>`).join('')}
            </ul>
            <a href="https://wa.me/6281234567890?text=Halo, saya tertarik dengan ${pkg.name}" target="_blank" class="block text-center w-full py-3 ${pkg.is_popular ? 'bg-warm-white text-charcoal hover:bg-stone-200' : 'border border-charcoal text-charcoal hover:bg-charcoal hover:text-warm-white'} text-sm tracking-widest uppercase transition-all duration-300">
                Pilih Paket
            </a>
        </div>
    `).join('');
}

async function loadTestimonials() {
    const { data } = await supabase
        .from('testimonials')
        .select('*')
        .eq('is_published', true)
        .eq('is_featured', true)
        .order('created_at', { ascending: false });
    
    if (!data) return;
    
    const container = document.getElementById('testimonials-container');
    if (!container) return;
    
    container.innerHTML = data.map(t => `
        <div class="bg-beige p-8 rounded-sm">
            <div class="flex mb-4">${'★'.repeat(t.rating).split('').map(() => '<svg class="w-5 h-5 text-charcoal" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>').join('')}</div>
            <p class="text-soft-charcoal italic mb-6 leading-relaxed">"${t.content}"</p>
            <p class="text-charcoal font-semibold">${t.couple_names}</p>
            <p class="text-xs text-soft-charcoal tracking-wider">Wedding di ${t.wedding_location || '-'}, ${t.wedding_year || ''}</p>
        </div>
    `).join('');
}

async function loadGalleries() {
    const { data } = await supabase
        .from('galleries')
        .select(`*, photos(*)`)
        .eq('is_published', true)
        .order('wedding_date', { ascending: false });
    
    if (!data) return;
    
    const container = document.getElementById('gallery-container');
    if (!container) return;
    
    let allPhotos = [];
    data.forEach(g => {
        g.photos.forEach(p => allPhotos.push({...p, gallery: g}));
    });
    
    container.innerHTML = allPhotos.map((p, i) => `
        <div class="break-inside-avoid group relative overflow-hidden rounded-sm cursor-pointer" onclick="openLightbox(${i})">
            <img src="${p.url}" alt="${p.alt_text || p.gallery.title}" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105">
            <div class="absolute inset-0 bg-charcoal/0 group-hover:bg-charcoal/20 transition-all duration-500"></div>
        </div>
    `).join('');
    
    // Update lightbox images
    window.galleryImages = allPhotos.map(p => p.url);
}

async function loadSettings() {
    const { data } = await supabase.from('settings').select('*');
    if (!data) return;
    
    const settings = {};
    data.forEach(s => settings[s.key] = s.value);
    
    // Update WhatsApp number
    if (settings.whatsapp_number) {
        document.querySelectorAll('a[href*="wa.me"]').forEach(a => {
            a.href = a.href.replace(/62\d+/, settings.whatsapp_number);
        });
    }
    
    // Update social media
    if (settings.instagram_url) {
        document.querySelectorAll('a[href*="instagram.com"]').forEach(a => a.href = settings.instagram_url);
    }
    if (settings.facebook_url) {
        document.querySelectorAll('a[href*="facebook.com"]').forEach(a => a.href = settings.facebook_url);
    }
    if (settings.tiktok_url) {
        document.querySelectorAll('a[href*="tiktok.com"]').forEach(a => a.href = settings.tiktok_url);
    }
}

// ============================================
// FORM SUBMISSION
// ============================================
document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = {
        nama: document.getElementById('nama').value,
        email: document.getElementById('email').value,
        whatsapp: document.getElementById('whatsapp').value,
        tanggal: document.getElementById('tanggal').value,
        package_interest: document.getElementById('paket').value,
        message: document.getElementById('pesan').value,
        status: 'new'
    };
    
    // Save to database
    const { error } = await supabase.from('inquiries').insert([formData]);
    
    if (error) {
        alert('Maaf, terjadi kesalahan. Silakan coba lagi.');
        return;
    }
    
    // Open WhatsApp
    const message = `Halo Eternal Moments!%0A%0ANama: ${formData.nama}%0AEmail: ${formData.email}%0ANo. WA: ${formData.whatsapp}%0ATanggal: ${formData.tanggal}%0APaket: ${formData.package_interest || '-'}%0APesan: ${formData.message || '-'}`;
    
    window.open(`https://wa.me/6281234567890?text=${message}`, '_blank');
    alert('Terima kasih! Inquiry Anda telah kami terima.');
    this.reset();
});

// Load all data on page load
document.addEventListener('DOMContentLoaded', () => {
    loadPackages();
    loadTestimonials();
    loadGalleries();
    loadSettings();
});
</script>
