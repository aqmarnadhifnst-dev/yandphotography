<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Koneksi Supabase - Yand Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .log-success { color: #166534; background-color: #dcfce7; }
        .log-error { color: #991b1b; background-color: #fee2e2; }
        .log-info { color: #1e3a8a; background-color: #dbeafe; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🔌 Tes Koneksi Database Supabase</h1>
        <p class="text-gray-600 mb-6">Project: <span class="font-mono bg-gray-100 px-2 py-1 rounded">rrtngjhxqyocbslnlolr</span></p>

        <button onclick="runConnectionTest()" id="testBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            JALANKAN TES DATABASE
        </button>

        <div id="loading" class="hidden mt-6 text-center text-blue-600">
            <svg class="animate-spin h-6 w-6 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Sedang menghubungi Supabase...
        </div>

        <div id="results" class="mt-6 space-y-3 hidden">
            <h3 class="font-semibold text-gray-700 border-b pb-2">Hasil Tes:</h3>
            <div id="log-container" class="space-y-2 font-mono text-sm"></div>
        </div>
    </div>

    <script>
        // Kredensial Anda
        const SUPABASE_URL = 'https://rrtngjhxqyocbslnlolr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9sIAK8Ev_hpsv2d_nQlH8w_7e9o9cSW';
        
        // Inisialisasi Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function addLog(message, type = 'info') {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.className = `p-3 rounded border-l-4 ${type === 'success' ? 'log-success border-green-600' : type === 'error' ? 'log-error border-red-600' : 'log-info border-blue-600'}`;
            div.innerHTML = message;
            container.appendChild(div);
        }

        async function runConnectionTest() {
            const btn = document.getElementById('testBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const logContainer = document.getElementById('log-container');

            // Reset UI
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            loading.classList.remove('hidden');
            results.classList.remove('hidden');
            logContainer.innerHTML = '';

            addLog('1. Memulai inisialisasi koneksi ke Supabase...', 'info');

            try {
                // TES 1: Membaca Data (SELECT)
                addLog('2. Mencoba membaca data dari tabel <b>packages</b>...', 'info');
                const { data: packages, error: err1 } = await supabase.from('packages').select('name, price');
                
                if (err1) {
                    addLog(`❌ GAGAL Membaca Data: ${err1.message}`, 'error');
                    addLog('<i>Catatan: Pastikan Anda sudah menjalankan SQL Schema di SQL Editor Supabase.</i>', 'error');
                } else {
                    addLog(`✅ BERHASIL Membaca Data! Ditemukan ${packages.length} paket.`, 'success');
                    packages.forEach(p => {
                        addLog(`&nbsp;&nbsp;↳ - ${p.name} (Rp ${(p.price/1000000).toFixed(0)} Jt)`, 'info');
                    });
                }

                // TES 2: Menulis Data (INSERT)
                addLog('3. Mencoba menulis data tes ke tabel <b>inquiries</b>...', 'info');
                const testInquiry = {
                    nama: 'TEST_USER_' + Math.floor(Math.random() * 1000),
                    email: 'test@yandphotography.com',
                    whatsapp: '08123456789',
                    package_interest: 'Test Package',
                    message: 'Ini adalah pesan otomatis dari script tes koneksi.',
                    status: 'test_connection'
                };

                const { data: insertData, error: err2 } = await supabase.from('inquiries').insert([testInquiry]).select();

                if (err2) {
                    addLog(`❌ GAGAL Menulis Data: ${err2.message}`, 'error');
                    addLog('<i>Catatan: Cek Row Level Security (RLS) di tabel inquiries, pastikan ada policy untuk INSERT.</i>', 'error');
                } else {
                    addLog(`✅ BERHASIL Menulis Data! ID Inquiry: ${insertData[0].id}`, 'success');
                }

                // KESIMPULAN
                addLog('<br>🎉 <b>TES SELESAI!</b> Jika ada tanda ✅, berarti koneksi database Anda BERHASIL dan siap digunakan.', 'success');

            } catch (err) {
                addLog(`❌ ERROR SISTEM: ${err.message}`, 'error');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.innerHTML = 'JALANKAN TES ULANG';
            }
        }
    </script>
</body>
</html>
