<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Yand Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'serif': ['Playfair Display', 'serif'], 'sans': ['Inter', 'sans-serif'] },
                    colors: { 'warm-white': '#FDFBF7', 'beige': '#F4F1EA', 'charcoal': '#2D2D2D', 'soft-charcoal': '#4A4A4A' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { background-color: #2D2D2D; color: #FDFBF7; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .toast { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="bg-beige min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 md:p-12 rounded-sm shadow-2xl max-w-md w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-serif text-charcoal mb-2">Yand <span class="italic">Photography</span></h1>
                <p class="text-soft-charcoal text-sm">Admin Dashboard</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-charcoal mb-2">Email</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm focus:outline-none focus:border-charcoal">
                </div>
                <div>
                    <label class="block text-sm text-charcoal mb-2">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm focus:outline-none focus:border-charcoal">
                </div>
                <button type="submit" class="w-full py-3 bg-charcoal text-warm-white text-sm tracking-widest uppercase hover:bg-soft-charcoal transition-colors">Login</button>
                <p id="loginError" class="text-red-600 text-sm text-center hidden"></p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="hidden">
        <header class="bg-white border-b border-stone-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-serif text-charcoal">Admin <span class="italic">Dashboard</span></h1>
                <div class="flex items-center gap-4">
                    <span id="adminEmail" class="text-sm text-soft-charcoal hidden md:block"></span>
                    <button onclick="logout()" class="text-sm text-charcoal hover:text-red-600 transition-colors"><i class="fas fa-sign-out-alt mr-1"></i> Logout</button>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-6 py-8">
            <!-- Tabs -->
            <div class="flex flex-wrap gap-2 mb-8 border-b border-stone-200 pb-4">
                <button onclick="showTab('overview')" class="tab-btn tab-active px-4 py-2 text-sm tracking-wider uppercase rounded-sm transition-colors" data-tab="overview"><i class="fas fa-chart-line mr-2"></i>Overview</button>
                <button onclick="showTab('packages')" class="tab-btn px-4 py-2 text-sm tracking-wider uppercase rounded-sm hover:bg-stone-100 transition-colors" data-tab="packages"><i class="fas fa-box mr-2"></i>Paket</button>
                <button onclick="showTab('galleries')" class="tab-btn px-4 py-2 text-sm tracking-wider uppercase rounded-sm hover:bg-stone-100 transition-colors" data-tab="galleries"><i class="fas fa-images mr-2"></i>Galeri</button>
                <button onclick="showTab('testimonials')" class="tab-btn px-4 py-2 text-sm tracking-wider uppercase rounded-sm hover:bg-stone-100 transition-colors" data-tab="testimonials"><i class="fas fa-quote-right mr-2"></i>Testimoni</button>
                <button onclick="showTab('inquiries')" class="tab-btn px-4 py-2 text-sm tracking-wider uppercase rounded-sm hover:bg-stone-100 transition-colors" data-tab="inquiries"><i class="fas fa-envelope mr-2"></i>Inquiry</button>
            </div>

            <!-- TAB: OVERVIEW -->
            <div id="tab-overview" class="tab-content">
                <h2 class="text-2xl font-serif text-charcoal mb-6">Dashboard Overview</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-sm shadow-sm">
                        <p class="text-xs text-soft-charcoal tracking-wider uppercase mb-2">Total Inquiry</p>
                        <p id="stat-inquiries" class="text-3xl font-serif text-charcoal">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-sm shadow-sm">
                        <p class="text-xs text-soft-charcoal tracking-wider uppercase mb-2">Total Galeri</p>
                        <p id="stat-galleries" class="text-3xl font-serif text-charcoal">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-sm shadow-sm">
                        <p class="text-xs text-soft-charcoal tracking-wider uppercase mb-2">Total Testimoni</p>
                        <p id="stat-testimonials" class="text-3xl font-serif text-charcoal">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-sm shadow-sm">
                        <p class="text-xs text-soft-charcoal tracking-wider uppercase mb-2">Paket Aktif</p>
                        <p id="stat-packages" class="text-3xl font-serif text-charcoal">0</p>
                    </div>
                </div>
            </div>

            <!-- TAB: PACKAGES -->
            <div id="tab-packages" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-serif text-charcoal">Kelola Paket</h2>
                    <button onclick="openPackageModal()" class="px-4 py-2 bg-charcoal text-warm-white text-sm tracking-wider uppercase hover:bg-soft-charcoal"><i class="fas fa-plus mr-2"></i>Tambah Paket</button>
                </div>
                <div id="packages-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- TAB: GALLERIES -->
            <div id="tab-galleries" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-serif text-charcoal">Kelola Galeri</h2>
                    <button onclick="openGalleryModal()" class="px-4 py-2 bg-charcoal text-warm-white text-sm tracking-wider uppercase hover:bg-soft-charcoal"><i class="fas fa-plus mr-2"></i>Tambah Galeri</button>
                </div>
                <div id="galleries-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <!-- TAB: TESTIMONIALS -->
            <div id="tab-testimonials" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-serif text-charcoal">Kelola Testimoni</h2>
                    <button onclick="openTestimonialModal()" class="px-4 py-2 bg-charcoal text-warm-white text-sm tracking-wider uppercase hover:bg-soft-charcoal"><i class="fas fa-plus mr-2"></i>Tambah Testimoni</button>
                </div>
                <div id="testimonials-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>

            <!-- TAB: INQUIRIES -->
            <div id="tab-inquiries" class="tab-content hidden">
                <h2 class="text-2xl font-serif text-charcoal mb-6">Pesan Inquiry Masuk</h2>
                <div id="inquiries-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- MODALS (Package, Gallery, Testimonial) -->
    <div id="packageModal" class="modal fixed inset-0 z-50 bg-charcoal/80 items-center justify-center p-4">
        <div class="bg-white rounded-sm max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 class="text-xl font-serif text-charcoal mb-4">Kelola Paket</h3>
            <form id="packageForm" class="space-y-4">
                <input type="hidden" id="package-id">
                <input type="text" id="package-name" placeholder="Nama Paket (cth: Gold Collection)" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <input type="number" id="package-price" placeholder="Harga (angka saja, cth: 22000000)" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <textarea id="package-description" placeholder="Deskripsi singkat" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm"></textarea>
                <textarea id="package-features" placeholder="Fitur (satu per baris)" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm"></textarea>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2"><input type="checkbox" id="package-popular" class="w-4 h-4"> <span class="text-sm">Paket Populer</span></label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="package-active" checked class="w-4 h-4"> <span class="text-sm">Aktif</span></label>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 py-3 bg-charcoal text-warm-white text-sm uppercase">Simpan</button>
                    <button type="button" onclick="closeModal('packageModal')" class="flex-1 py-3 border border-stone-300 text-charcoal text-sm uppercase">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <div id="galleryModal" class="modal fixed inset-0 z-50 bg-charcoal/80 items-center justify-center p-4">
        <div class="bg-white rounded-sm max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 class="text-xl font-serif text-charcoal mb-4">Kelola Galeri</h3>
            <form id="galleryForm" class="space-y-4">
                <input type="hidden" id="gallery-id">
                <input type="text" id="gallery-title" placeholder="Judul (cth: Wedding Andi & Budi)" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <input type="text" id="gallery-couple" placeholder="Nama Pasangan" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <input type="text" id="gallery-location" placeholder="Lokasi" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <input type="url" id="gallery-cover" placeholder="URL Cover Image (opsional)" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <label class="flex items-center gap-2"><input type="checkbox" id="gallery-published" checked class="w-4 h-4"> <span class="text-sm">Published (Tampil di Website)</span></label>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 py-3 bg-charcoal text-warm-white text-sm uppercase">Simpan</button>
                    <button type="button" onclick="closeModal('galleryModal')" class="flex-1 py-3 border border-stone-300 text-charcoal text-sm uppercase">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <div id="testimonialModal" class="modal fixed inset-0 z-50 bg-charcoal/80 items-center justify-center p-4">
        <div class="bg-white rounded-sm max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <h3 class="text-xl font-serif text-charcoal mb-4">Kelola Testimoni</h3>
            <form id="testimonialForm" class="space-y-4">
                <input type="hidden" id="testimonial-id">
                <input type="text" id="testimonial-couple" placeholder="Nama Pasangan" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                <textarea id="testimonial-content" placeholder="Isi Testimoni" required class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm"></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="testimonial-rating" min="1" max="5" value="5" placeholder="Rating (1-5)" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                    <input type="text" id="testimonial-location" placeholder="Lokasi Wedding" class="w-full px-4 py-3 bg-warm-white border border-stone-300 rounded-sm">
                </div>
                <label class="flex items-center gap-2"><input type="checkbox" id="testimonial-featured" class="w-4 h-4"> <span class="text-sm">Featured (Tampil di Beranda)</span></label>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 py-3 bg-charcoal text-warm-white text-sm uppercase">Simpan</button>
                    <button type="button" onclick="closeModal('testimonialModal')" class="flex-1 py-3 border border-stone-300 text-charcoal text-sm uppercase">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-6 right-6 z-[100] hidden">
        <div class="bg-charcoal text-warm-white px-6 py-3 rounded-sm shadow-2xl toast"><p id="toastMessage" class="text-sm"></p></div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (SUDAH DIISI)
        // ==========================================
        const SUPABASE_URL = 'https://rrtngjhxqyocbslnlolr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9sIAK8Ev_hpsv2d_nQlH8w_7e9o9cSW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // AUTH
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('loginError').textContent = 'Email atau password salah';
                document.getElementById('loginError').classList.remove('hidden');
                return;
            }
            currentUser = data.user;
            document.getElementById('adminEmail').textContent = currentUser.email;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            loadOverview();
        });

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // TABS
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('hover:bg-stone-100');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('hover:bg-stone-100');

            if(tabName === 'overview') loadOverview();
            if(tabName === 'packages') loadPackages();
            if(tabName === 'galleries') loadGalleries();
            if(tabName === 'testimonials') loadTestimonials();
            if(tabName === 'inquiries') loadInquiries();
        }

        // OVERVIEW
        async function loadOverview() {
            const [inq, gal, test, pkg] = await Promise.all([
                supabase.from('inquiries').select('id', { count: 'exact' }),
                supabase.from('galleries').select('id', { count: 'exact' }),
                supabase.from('testimonials').select('id', { count: 'exact' }),
                supabase.from('packages').select('id', { count: 'exact' }).eq('is_active', true)
            ]);
            document.getElementById('stat-inquiries').textContent = inq.count || 0;
            document.getElementById('stat-galleries').textContent = gal.count || 0;
            document.getElementById('stat-testimonials').textContent = test.count || 0;
            document.getElementById('stat-packages').textContent = pkg.count || 0;
        }

        // PACKAGES
        async function loadPackages() {
            const { data } = await supabase.from('packages').select('*').order('price');
            document.getElementById('packages-list').innerHTML = (data || []).map(p => `
                <div class="bg-white p-6 rounded-sm shadow-sm border border-stone-200">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-serif text-charcoal">${p.name}</h3>
                        ${p.is_popular ? '<span class="text-xs bg-charcoal text-warm-white px-2 py-1 rounded">POPULER</span>' : ''}
                    </div>
                    <p class="text-2xl font-serif text-charcoal mb-4">Rp ${(p.price/1000000).toFixed(0)} Jt</p>
                    <ul class="space-y-1 mb-4">${p.features.map(f => `<li class="text-xs text-soft-charcoal">✓ ${f}</li>`).join('')}</ul>
                    <div class="flex gap-2">
                        <button onclick="deleteItem('packages', ${p.id}, loadPackages)" class="flex-1 py-2 border border-red-500 text-red-500 text-xs uppercase hover:bg-red-500 hover:text-white rounded-sm">Hapus</button>
                    </div>
                </div>
            `).join('') || '<p class="text-soft-charcoal">Belum ada paket</p>';
        }

        document.getElementById('packageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('package-name').value,
                slug: document.getElementById('package-name').value.toLowerCase().replace(/\s+/g, '-'),
                price: parseInt(document.getElementById('package-price').value),
                description: document.getElementById('package-description').value,
                features: document.getElementById('package-features').value.split('\n').filter(f => f.trim()),
                is_popular: document.getElementById('package-popular').checked,
                is_active: document.getElementById('package-active').checked
            };
            await supabase.from('packages').insert([payload]);
            closeModal('packageModal');
            showToast('Paket berhasil disimpan');
            loadPackages();
            e.target.reset();
        });

        // GALLERIES
        async function loadGalleries() {
            const { data } = await supabase.from('galleries').select('*').order('created_at', { ascending: false });
            document.getElementById('galleries-list').innerHTML = (data || []).map(g => `
                <div class="bg-white rounded-sm shadow-sm overflow-hidden">
                    ${g.cover_image ? `<img src="${g.cover_image}" class="w-full h-48 object-cover">` : '<div class="w-full h-48 bg-beige flex items-center justify-center"><i class="fas fa-image text-4xl text-stone-300"></i></div>'}
                    <div class="p-4">
                        <h3 class="font-serif text-charcoal">${g.title}</h3>
                        <p class="text-sm text-soft-charcoal">${g.couple_names || '-'} • ${g.location || '-'}</p>
                        <div class="flex gap-2 mt-4">
                            <button onclick="deleteItem('galleries', ${g.id}, loadGalleries)" class="flex-1 py-2 border border-red-500 text-red-500 text-xs uppercase hover:bg-red-500 hover:text-white rounded-sm">Hapus</button>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-soft-charcoal">Belum ada galeri</p>';
        }

        document.getElementById('galleryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('gallery-title').value,
                couple_names: document.getElementById('gallery-couple').value,
                location: document.getElementById('gallery-location').value,
                cover_image: document.getElementById('gallery-cover').value,
                is_published: document.getElementById('gallery-published').checked
            };
            await supabase.from('galleries').insert([payload]);
            closeModal('galleryModal');
            showToast('Galeri berhasil disimpan');
            loadGalleries();
            e.target.reset();
        });

        // TESTIMONIALS
        async function loadTestimonials() {
            const { data } = await supabase.from('testimonials').select('*').order('created_at', { ascending: false });
            document.getElementById('testimonials-list').innerHTML = (data || []).map(t => `
                <div class="bg-white p-6 rounded-sm shadow-sm">
                    <h3 class="font-serif text-charcoal">${t.couple_names}</h3>
                    <p class="text-sm text-soft-charcoal italic mb-4">"${t.content}"</p>
                    <div class="flex gap-2">
                        <button onclick="deleteItem('testimonials', ${t.id}, loadTestimonials)" class="flex-1 py-2 border border-red-500 text-red-500 text-xs uppercase hover:bg-red-500 hover:text-white rounded-sm">Hapus</button>
                    </div>
                </div>
            `).join('') || '<p class="text-soft-charcoal">Belum ada testimoni</p>';
        }

        document.getElementById('testimonialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                couple_names: document.getElementById('testimonial-couple').value,
                content: document.getElementById('testimonial-content').value,
                rating: parseInt(document.getElementById('testimonial-rating').value),
                wedding_location: document.getElementById('testimonial-location').value,
                is_featured: document.getElementById('testimonial-featured').checked,
                is_published: true
            };
            await supabase.from('testimonials').insert([payload]);
            closeModal('testimonialModal');
            showToast('Testimoni berhasil disimpan');
            loadTestimonials();
            e.target.reset();
        });

        // INQUIRIES
        async function loadInquiries() {
            const { data } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false });
            document.getElementById('inquiries-list').innerHTML = (data || []).map(i => `
                <div class="bg-white p-6 rounded-sm shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-serif text-charcoal">${i.nama}</h3>
                        <span class="text-xs px-2 py-1 rounded-sm bg-stone-200 text-charcoal">${i.status || 'new'}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm mb-3">
                        <p><i class="fab fa-whatsapp text-soft-charcoal mr-2"></i>${i.whatsapp || '-'}</p>
                        <p><i class="fas fa-box text-soft-charcoal mr-2"></i>${i.package_interest || '-'}</p>
                    </div>
                    <p class="text-sm text-soft-charcoal italic mb-3">"${i.message || '-'}"</p>
                    <a href="https://wa.me/${i.whatsapp ? i.whatsapp.replace(/\D/g,'') : ''}?text=Halo ${i.nama}, terima kasih sudah menghubungi Yand Photography." target="_blank" class="inline-block px-4 py-2 bg-green-600 text-white text-xs uppercase rounded-sm hover:bg-green-700">
                        <i class="fab fa-whatsapp mr-1"></i> Balas via WhatsApp
                    </a>
                    <button onclick="deleteItem('inquiries', ${i.id}, loadInquiries)" class="ml-2 px-4 py-2 border border-red-500 text-red-500 text-xs uppercase rounded-sm hover:bg-red-500 hover:text-white">Hapus</button>
                </div>
            `).join('') || '<p class="text-soft-charcoal">Tidak ada inquiry</p>';
        }

        // UTILS
        async function deleteItem(table, id, callback) {
            if (!confirm('Yakin hapus data ini?')) return;
            await supabase.from(table).delete().eq('id', id);
            showToast('Data berhasil dihapus');
            callback();
        }

        function openPackageModal() { document.getElementById('packageModal').classList.add('active'); }
        function openGalleryModal() { document.getElementById('galleryModal').classList.add('active'); }
        function openTestimonialModal() { document.getElementById('testimonialModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showToast(message) {
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('toast').classList.add('hidden'), 3000);
        }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        });
    </script>
</body>
</html>
